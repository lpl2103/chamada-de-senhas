<!DOCTYPE html>
<html lang="pt-BR" class="tv-mode">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painel da TV da Sala de Espera - ChamaSenha - Zenit Tecnologia" />
  <meta name="theme-color" content="#003a5f" />

  <title>Painel TV - ChamaSenha</title>

  <!-- Fontes de Alta Performance Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Estilos Gerais da Aplicação -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Script Específico do Painel da TV -->
  <script src="js/tv.js" defer></script>
</head>

<body class="tv-mode">
  <a href="#main-tv-content" class="skip-link">Pular para o conteúdo principal</a>

  <!-- ====================================================================
       CABEÇALHO DA TV (LOGO DA ZENIT TECNOLOGIA E RELÓGIO NO CANTO SUPERIOR DIREITO)
       ==================================================================== -->
  <header class="app-header tv-header-minimal" role="banner">
    <div class="tv-header-content">
      <div class="tv-header-right">
        <img src="imagens/nvzenit.webp" alt="Logo Zenit Tecnologia" class="tv-brand-logo" />
        <div class="clock-display">
          <span id="digitalClock" class="clock-time">00:00:00</span>
          <span id="digitalDate" class="clock-date">seg., 01/01/2026</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ====================================================================
       CONTEÚDO PRINCIPAL DA TV (ENCAIXE PERFEITO EM 100VH)
       ==================================================================== -->
  <main id="main-tv-content" class="main-container tv-container" role="main">
    
    <!-- Card Gigante de Exibição Principal da TV -->
    <section id="tvDisplayCard" class="display-card tv-display-card" aria-live="assertive" aria-atomic="true">
      <div class="tv-card-header">
        <span class="display-label">SENHA</span>
        <span id="tvGuicheBadge" class="guiche-badge-pill tv-guiche-badge">GUICHÊ 01</span>
      </div>

      <div id="tvSenhaAtualNumero" class="display-number tv-display-number">N000</div>
      <div id="tvDisplayTypeBadge" class="display-type-badge tv-type-badge">Aguardando Chamada</div>
    </section>

    <!-- Lista Vertical do Histórico das Últimas 3 Senhas Chamadas -->
    <section class="secondary-card tv-history-card" aria-label="Histórico de Chamadas Recentes">
      <h2 class="card-title tv-history-title">ÚLTIMAS SENHAS CHAMADAS</h2>
      <ul id="tvHistoricoLista" class="history-list tv-history-list">
        <li class="history-item" style="opacity: 0.6;">Aguardando início do atendimento...</li>
      </ul>
    </section>

  </main>

  <!-- Áudio Sonoro para Anúncio -->
  <audio id="audioChamada" preload="auto">
    <source src="audio/chamada.wav" type="audio/wav" />
  </audio>

  <!-- Rodapé Minimalista com Indicador de Conexão -->
  <footer class="app-footer tv-footer" role="contentinfo">
    <div class="footer-content">
      <p>&copy; <span id="currentYear">2026</span> ZENIT TECNOLOGIA - Sistema de Chamada de Senhas</p>
      
      <div class="status-indicator">
        <span id="statusDot" class="status-dot online"></span>
        <span id="statusText">Conectado ao Servidor</span>
      </div>
    </div>
  </footer>
</body>
</html>
